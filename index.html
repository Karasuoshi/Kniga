<!doctype html>
<html lang="ru">
<head>

  <div class="wrap">

    <nav id="nav" aria-label="Разделы"></nav>

<section class="hero" id="top">

    <div class="lineup" id="lineup" aria-label="Герои книги"></div>

  </div></div></div>

    <div class="kids" id="kids"></div>

  <section class="block" id="academy">

<footer class="wrap" id="footer"></footer>
